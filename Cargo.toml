[package]
name = "xmip-core-authenticate-jwt"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-authenticate-jwt"
description = "Authenticate by jwt: verifies a token's signature (HS256, RS256, ES256), expiry, issuer, audience. A xmip-core-authenticate technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): authenticate for the trait, the clock and the
# claims checks, identify for Presented, context for Verified, xcore for the
# mechanism catalog.
authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main" }
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The token, the keys and the three signature algorithms RFC 7518 makes
# required or recommended are the estate's one JOSE (`jose::jwt`,
# `jose::jwk`), which `oidc` verifies with too.
jose = { package = "xmip-core-library-jose", git = "https://github.com/IlleNilsson/xmip-core-library-jose", branch = "main", features = ["key"] }

[dev-dependencies]
# The tests mint tokens: rand to generate the RSA key, the three algorithms
# to sign with as an issuer would — HS256 by the estate's HMAC, RS256 and
# ES256 by implementations other than the one that verifies — and the
# estate's base64url to encode them. rand 0.8, not the newest: rsa 0.9, the
# newest release, draws from rand_core 0.6, the generation rand 0.8 is on.
# p256 draws its own key.
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.14", features = ["ecdsa", "pem", "getrandom"] }
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
