[package]
name = "xmip-core-authenticate-jwt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authenticate-jwt"
description = "Authenticate by jwt: verifies a token's signature (HS256, RS256, ES256), expiry, issuer, audience. A xmip-core-authenticate technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): authenticate for the trait, the clock and the
# claims checks, identify for Presented, context for Verified, xcore for the
# mechanism catalog.
authenticate = { workspace = true }
identify = { workspace = true }
context = { workspace = true }
xcore = { workspace = true }
# The token, the keys and the three signature algorithms RFC 7518 makes
# required or recommended are the estate's one JOSE (`jose::jwt`,
# `jose::jwk`), which `oidc` verifies with too.
jose = { workspace = true, features = ["key"] }

[dev-dependencies]
# The tests mint tokens: rand to generate the RSA key, the three algorithms
# to sign with as an issuer would — HS256 by the estate's HMAC, RS256 and
# ES256 by implementations other than the one that verifies — and the
# estate's base64url to encode them. rand 0.8, not the newest: rsa 0.9, the
# newest release, draws from rand_core 0.6, the generation rand 0.8 is on.
# p256 draws its own key.
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.14", features = ["ecdsa", "pem", "getrandom"] }
codec = { workspace = true }

[lints]
workspace = true
